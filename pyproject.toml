[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "prediction-app"
version = "0.1.0"
description = "An auditable NFL quarterback passing-yards research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy==0.1.5",
    "polars==1.44.2",
    "tzdata>=2025.1",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
nfl-prop = "nfl_prop_model.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_prop_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["nflreadpy.*", "sklearn.*"]
ignore_missing_imports = true
