name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            venv_python: .venv/bin/python
          - os: windows-latest
            python: '3.12'
            venv_python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # Hosted runners can contain unrelated global packages (for example pipx).
      # Validate only this project's locked dependency graph in a clean environment.
      - run: python -m venv .venv
      - run: ${{ matrix.venv_python }} -m pip install -c requirements-dev.lock -e ".[dev,app]"
      - run: ${{ matrix.venv_python }} -m pip check
      - run: ${{ matrix.venv_python }} -m ruff check .
      - run: ${{ matrix.venv_python }} -m ruff format --check .
      - run: ${{ matrix.venv_python }} -m mypy src
      - run: ${{ matrix.venv_python }} -m pytest
